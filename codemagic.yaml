workflows:
  tyto-android-test:
    name: Tyto — build de test Android
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Récupérer les dépendances
        script: flutter pub get
      - name: Construire un APK de test (non signé, pour tester rapidement)
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  tyto-android-release:
    name: Tyto — publication Play Store (signé)
    max_build_duration: 30
    environment:
      flutter: stable
      android_signing:
        - tyto_keystore
      vars:
        # ⚠️ À augmenter à chaque nouvelle publication (le dernier numéro
        # déjà utilisé était 4, avec l'ancienne version du site empaqueté).
        VERSION_CODE: 7
    scripts:
      - name: Récupérer les dépendances
        script: flutter pub get
      - name: Préparer la signature (key.properties)
        script: |
          cat > android/key.properties << EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Construire le fichier de publication (.aab), signé
        script: |
          flutter build appbundle --release --build-number=$VERSION_CODE
    artifacts:
      - build/app/outputs/bundle/release/*.aab
