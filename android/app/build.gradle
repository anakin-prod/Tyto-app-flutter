plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "5"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"

// La vraie signature (ta clé du 20 juillet), lue depuis key.properties.
// Ce fichier n'est jamais dans le dépôt Git — Codemagic le crée lui-même
// au moment du build, à partir de tes identifiants stockés chez eux de
// façon chiffrée.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "app.tytoai.twa"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // ⚠️ Même identifiant que l'app actuelle (Play Console), pour pouvoir
        // un jour remplacer la version PWA par celle-ci comme une simple mise
        // à jour, sans perdre les avis / installations déjà en place.
        applicationId "app.tytoai.twa"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // La vraie clé si elle est disponible (build de publication),
            // sinon la clé de debug (build de test rapide, comme avant).
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
