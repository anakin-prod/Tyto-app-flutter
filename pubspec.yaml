name: tyto_app
description: "Tyto — l'IA du monde animal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1       # charge Fraunces, Newsreader, Karla automatiquement
  http: ^1.2.1               # appels vers l'API de tytoai.app (le site déjà en place)
  supabase_flutter: ^2.6.0   # connexion (lien magique / Google), même compte que le site
  url_launcher: ^6.3.0       # ouvre les pages de paiement Stripe dans le navigateur
  flutter_svg: ^2.0.10       # affiche les icônes SVG EXACTES du site (mêmes tracés)
  image_picker: ^1.1.2       # photographier une ordonnance (fonction Pro)
  image: ^4.2.0              # compresser la photo avant l'envoi, comme le site
  speech_to_text: ^7.0.0     # dictée vocale des observations (fonction Pro)
  share_plus: ^10.0.2        # partager l'affiche générée (remplace l'impression du site)
  path_provider: ^2.1.4      # emplacement temporaire pour l'affiche avant partage
  in_app_review: ^2.0.9      # invite à noter l'app, au bon moment
  pdf: ^3.11.1                # dossier PDF du carnet de santé, comme le site
  flutter_local_notifications: ^18.0.1  # rappels de vaccins/vermifuges sur le téléphone
  timezone: ^0.9.4            # les notifications programmées ont besoin du fuseau horaire
  shared_preferences: ^2.2.3 # mémorise la session utilisateur sur l'appareil
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
